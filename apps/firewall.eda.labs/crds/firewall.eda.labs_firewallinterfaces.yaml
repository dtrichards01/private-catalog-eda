---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: firewallinterfaces.firewall.eda.labs
spec:
  group: firewall.eda.labs
  names:
    kind: FirewallInterface
    listKind: FirewallInterfaceList
    plural: firewallinterfaces
    singular: firewallinterface
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.firewall
      name: Firewall
      type: string
    - jsonPath: .spec.name
      name: Interface
      type: string
    - jsonPath: .spec.side
      name: Side
      type: string
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .spec.attachment.virtualNetwork
      name: VNET
      type: string
    - jsonPath: .status.operationalState
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FirewallInterfaceSpec is one NIC on an external firewall.
              Classic: Attachment is the leaf edge port in a virtual network you build,
              and BGP is the eBGP neighbor on that network. Advanced Networking: the
              NIC is a FortiGate underlay port to a spine, and the app builds the spine
              default interface and default BGP. Set one of Attachment or Advanced.
            properties:
              address:
                description: |-
                  IPv4 address and prefix, for example 10.31.1.1/24. The fabric gateway
                  is .254 in this subnet, or .253 when the firewall is .254.
                type: string
              advanced:
                description: |-
                  FortiGate underlay to a spine. Builds the spine default interface, EVPN
                  policy, default BGP group, and default BGP peer, and pushes the VXLAN
                  services to the FortiGate. Leave empty for classic.
                properties:
                  bgp:
                    description: eBGP between the spine and the FortiGate.
                    properties:
                      families:
                        default:
                        - ipv4-unicast
                        - evpn
                        description: ipv4-unicast carries the VTEP address. evpn carries
                          the services.
                        items:
                          type: string
                        type: array
                      localAS:
                        description: Spine AS. The FortiGate writes this as the remote
                          AS.
                        format: int32
                        type: integer
                      peerAS:
                        description: FortiGate AS.
                        format: int32
                        type: integer
                    required:
                    - localAS
                    - peerAS
                    type: object
                  encapType:
                    default: "Null"
                    description: Null is untagged. dot1q puts the spine default interface
                      on a VLAN.
                    enum:
                    - "Null"
                    - dot1q
                    type: string
                  interface:
                    description: Interface on the selected spine. Shown after the
                      node is chosen.
                    type: string
                  node:
                    description: Spine this NIC is cabled to.
                    type: string
                  services:
                    description: |-
                      Client services carried over this underlay as VXLAN. Each service is
                      one bridge domain mapped to one FortiGate VXLAN interface.
                    items:
                      description: AdvancedServiceSpec maps one client virtual network
                        to the FortiGate.
                      properties:
                        address:
                          description: FortiGate address on this service, for example
                            10.208.0.1/24.
                          type: string
                        allowPing:
                          description: Allow ping on the service VXLAN interface.
                          type: boolean
                        bridgeDomain:
                          description: Bridge domain in that virtual network. Empty
                            uses its only bridge domain.
                          type: string
                        tenant:
                          description: |-
                            FortiGate VDOM for this service. Empty uses root. This lab FortiGate
                            has only root, so the service is in the same VDOM as this NIC.
                          type: string
                        virtualNetwork:
                          description: |-
                            Client virtual network. Its bridge domain supplies the VNI, EVI, and
                            route target pushed to the FortiGate.
                          type: string
                        vni:
                          description: |-
                            Expected VNI. Empty reads it from the bridge domain. When set, it has
                            to match the bridge domain.
                          format: int32
                          type: integer
                      required:
                      - address
                      - virtualNetwork
                      type: object
                    type: array
                  underlay:
                    default: evpn-vxlan
                    enum:
                    - evpn-vxlan
                    type: string
                  vlanID:
                    description: Required when encapsulation is dot1q.
                    format: int32
                    maximum: 4094
                    minimum: 1
                    type: integer
                required:
                - bgp
                - interface
                - node
                type: object
              allowPing:
                description: |-
                  Allow ping on this NIC. Off unless set. Palo Alto attaches management
                  profile eda-ping. FortiGate adds ping to the interface allowaccess.
                  When off, ping is removed and the NIC does not answer ping.
                type: boolean
              attachment:
                description: |-
                  Classic interconnect. Leaf edge port in an existing virtual network.
                  The virtual network owns the edge port, router, IRB or routed interface,
                  and BGP peer. Leave empty for Advanced Networking.
                properties:
                  encapType:
                    default: "Null"
                    description: Null is untagged. dot1q is a VLAN to the leaf. VXLAN
                      belongs in Advanced Networking.
                    enum:
                    - "Null"
                    - dot1q
                    type: string
                  interface:
                    description: |-
                      Interface on the selected node. Shown after the node is chosen.
                      A slash from the node, such as ethernet-1/4, is stored as ethernet-1-4.
                    type: string
                  node:
                    description: Node this cable attaches to. The list is the nodes
                      in the namespace.
                    type: string
                  virtualNetwork:
                    description: |-
                      Existing virtual network in this namespace. The list shows the virtual
                      networks that already exist. This app does not create one.
                    type: string
                  vlanID:
                    description: Required when encapsulation is dot1q.
                    format: int32
                    type: integer
                required:
                - interface
                - node
                - virtualNetwork
                type: object
              bgp:
                description: |-
                  Classic eBGP neighbor written to the firewall in the selected tenant.
                  Advanced Networking has its own BGP.
                properties:
                  localAS:
                    description: Fabric AS. The firewall writes this as the peer AS.
                    format: int32
                    type: integer
                  mode:
                    default: ebgp
                    enum:
                    - ebgp
                    type: string
                  peerAS:
                    description: Firewall AS. The firewall writes this as its local
                      AS.
                    format: int32
                    type: integer
                required:
                - localAS
                - peerAS
                type: object
              configureFirewall:
                description: |-
                  On: the collector writes this NIC, its BGP neighbor, and any Advanced
                  Networking services through the firewall API, and removes them when
                  this interface is deleted. Off: observe only. The collector reports
                  port and BGP state and writes nothing to the firewall.
                type: boolean
              enabled:
                default: true
                type: boolean
              firewall:
                description: Firewall in this namespace. Vendor on that Firewall selects
                  the API.
                type: string
              name:
                description: 'Device interface name: ethernet1/1 on Palo Alto, port2
                  on FortiGate.'
                type: string
              side:
                enum:
                - inside
                - outside
                type: string
              tenant:
                description: |-
                  Palo Alto virtual system or FortiGate VDOM for this NIC. Empty uses
                  vsys1 or root. Status on the Firewall lists the tenants it has.
                type: string
              vlanID:
                description: |-
                  VLAN tag pushed to this firewall NIC. Empty leaves the port untagged.
                  Palo Alto creates a subinterface. FortiGate creates a VLAN interface on this port.
                format: int32
                maximum: 4094
                minimum: 1
                type: integer
              zone:
                type: string
            required:
            - address
            - firewall
            - name
            - side
            type: object
          status:
            description: FirewallInterfaceStatus is the observed NIC and its fabric
              attachment.
            properties:
              adminState:
                type: string
              attachmentName:
                description: Leaf Interface resource created for this attachment.
                type: string
              message:
                type: string
              observedAddress:
                type: string
              operationalState:
                description: Up when the port is up. When this interface has BGP,
                  Up also requires that session to be established.
                type: string
              services:
                description: Advanced Networking services as resolved from the bridge
                  domain.
                items:
                  description: ServiceStatus is one Advanced Networking service on
                    the FortiGate.
                  properties:
                    bridgeDomain:
                      type: string
                    evi:
                      type: integer
                    interface:
                      description: FortiGate VXLAN interface for this service.
                      type: string
                    message:
                      type: string
                    routeTarget:
                      type: string
                    virtualNetwork:
                      type: string
                    vni:
                      type: integer
                  type: object
                type: array
              virtualNetwork:
                type: string
              zone:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
