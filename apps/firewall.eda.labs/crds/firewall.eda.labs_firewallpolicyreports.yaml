apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firewallpolicyreports.firewall.eda.labs
spec:
  group: firewall.eda.labs
  names:
    kind: FirewallPolicyReport
    listKind: FirewallPolicyReportList
    plural: firewallpolicyreports
    singular: firewallpolicyreport
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              firewall:
                type: string
                description: 'The Firewall this report belongs to. Set by the collector:
                  one report per Firewall, of the same name.'
              sourceHealth:
                type: string
                description: 'OK: a complete, consistent read. STALE_SOURCE: the read
                  failed or a commit landed during it; the last good translation is
                  kept. UNAVAILABLE: no policy reader for this vendor yet.'
              generation:
                type: string
                description: 'The result of the Firewall''s Policy Generation switch,
                  which is set on the Firewall. Enabled: the policy is built. Disabled:
                  preview only. Blocked: a fabric prerequisite is missing. Rejected:
                  EDA refused the transaction; retried after 15 minutes.'
              message:
                type: string
                description: Why the read or the generation is not OK.
              reasons:
                type: array
                items:
                  type: string
                description: Report-wide reasons.
              summary:
                type: object
                properties:
                  rules:
                    type: integer
                    description: Every rule in the vsys or VDOM, exported or not.
                  exported:
                    type: integer
                    description: Rules carrying the export tag. Only these are evaluated
                      and listed.
                  eligible:
                    type: integer
                    description: Exported rules that passed every check.
                  fabricEnforceable:
                    type: integer
                    description: Allow rules the fabric enforces.
                  fabricEnforceableDeny:
                    type: integer
                    description: Deny rules the fabric enforces.
                  ngfwRequired:
                    type: integer
                    description: Rules that need firewall inspection (App-ID, User-ID,
                      URL, HIP, profiles).
                  unsupported:
                    type: integer
                    description: Rules that cannot be translated. Each rule says why.
                  steered:
                    type: integer
                    description: 'Pairs of rules tagged eda-watch that can be sent
                      through the firewall: subnet pairs, and each watched IP with
                      its destination.'
                description: Rule counts.
              virtualNetworks:
                type: array
                items:
                  type: string
                description: 'Where the policy is applied: the virtual networks where
                  the operator''s AssociationPolicies attach the GroupTags the translation
                  uses.'
              rules:
                type: array
                items:
                  type: object
                  properties:
                    position:
                      type: integer
                      description: Place in the rulebase.
                    name:
                      type: string
                      description: Firewall rule name.
                    classification:
                      type: string
                      description: FABRIC_ENFORCEABLE, FABRIC_ENFORCEABLE_DENY, NGFW_REQUIRED
                        or UNSUPPORTED.
                    translationState:
                      type: string
                      description: DISCOVERED (disabled rule), EVALUATED (checked,
                        not translated), PROPOSED (passed every check), VALIDATED
                        (translated into entries).
                    derivedEntries:
                      type: integer
                      description: MicroSegmentationPolicy entries the rule produced.
                    reasons:
                      type: array
                      items:
                        type: string
                      description: Why the rule is not translated.
                    action:
                      type: string
                      description: allow, deny or drop (Palo Alto); accept or deny
                        (FortiGate).
                    source:
                      type: array
                      items:
                        type: string
                      description: Source objects.
                    destination:
                      type: array
                      items:
                        type: string
                      description: Destination objects.
                    services:
                      type: array
                      items:
                        type: string
                      description: Services resolved to protocol and ports.
                    applications:
                      type: array
                      items:
                        type: string
                      description: App-IDs. Anything but any needs the firewall.
                    from:
                      type: array
                      items:
                        type: string
                      description: Firewall source zones. Informational, not translated.
                    to:
                      type: array
                      items:
                        type: string
                      description: Firewall destination zones. Informational, not
                        translated.
                    enabled:
                      type: boolean
                      description: The rule is enabled on the firewall.
                    eligible:
                      type: boolean
                      description: The rule passed every check.
                    candidate:
                      type: string
                      description: What the rule would be once identity or scope resolves.
                        Empty when nothing on the EDA side can make it translate.
                    inspectionRequirement:
                      type: string
                      description: 'FABRIC, NGFW or UNSUPPORTED: where the rule can
                        be enforced.'
                    requires:
                      type: array
                      items:
                        type: string
                      description: Capabilities the rule needs, checked against the
                        compatibility profile.
                    id:
                      type: string
                      description: Firewall rule UUID.
                    pathRequirement:
                      type: boolean
                      description: 'Reserved: traffic must cross the firewall. Not
                        managed yet.'
                    pathState:
                      type: string
                      description: Reserved for firewall path steering. Always NOT_MANAGED.
                    bypassAuthorisation:
                      type: string
                      description: Reserved for firewall bypass. Always NOT_AUTHORISED.
                description: Every exported rule in rulebase order, with its classification
                  and reasons.
              groups:
                type: array
                items:
                  type: object
                  properties:
                    addressGroup:
                      type: string
                      description: The firewall address group.
                    groupTag:
                      type: string
                      description: The GroupTag of exactly the same name.
                    state:
                      type: string
                      description: 'RESOLVED: usable in rules. UNRESOLVED: see reasons.
                        NO_GROUPTAG: the name cannot be a GroupTag (upper case or
                        invalid), so its rules are rejected. EMPTY_MEMBERSHIP.'
                    tagSource:
                      type: string
                      description: 'Who makes the GroupTag: derived (this report),
                        operator (an existing GroupTag), or firewall:<name> (another
                        firewall). Empty when there is none.'
                    dynamic:
                      type: boolean
                      description: A dynamic group, whose members come from a tag
                        filter.
                    filter:
                      type: string
                      description: The dynamic group's tag filter.
                    virtualNetworks:
                      type: array
                      items:
                        type: string
                      description: Where the operator's AssociationPolicies attach
                        the GroupTag.
                    members:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Address object or registered IP.
                          type:
                            type: string
                            description: address-object or registered-ip.
                          address:
                            type: string
                            description: The prefix the member resolves to.
                          state:
                            type: string
                            description: 'IN_SCOPE: equals an IRB or routed subnet
                              whose attachments carry only this GroupTag. HOST_NOT_SUPPORTED:
                              a /32. NOT_AN_ATTACHMENT_SUBNET, SPLIT_ACROSS_TAGS,
                              OUTSIDE_TAG_TARGETS, UNMANAGED, AMBIGUOUS_SCOPE, UNRESOLVED.'
                          virtualNetworks:
                            type: array
                            items:
                              type: string
                            description: Virtual networks whose subnet the member
                              equals.
                      description: Each member and its check.
                    reasons:
                      type: array
                      items:
                        type: string
                      description: Why the group does not resolve.
                description: Every address group an exported rule names, mapped to
                  its GroupTag.
              derived:
                type: object
                properties:
                  policy:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The one MicroSegmentationPolicy for this firewall,
                          fw-<firewall>.
                      virtualNetworks:
                        type: array
                        items:
                          type: string
                        description: Where the policy is applied.
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            rule:
                              type: string
                              description: Firewall rule the entry comes from.
                            sourceGroupTag:
                              type: string
                              description: Source GroupTag.
                            destinationGroupTag:
                              type: string
                              description: Destination GroupTag.
                            protocol:
                              type: string
                              description: TCP or UDP. Empty matches every IPv4 protocol.
                            destinationPortNumber:
                              type: integer
                              description: Destination port.
                            destinationPortRange:
                              type: string
                              description: Destination port range.
                            sourcePortNumber:
                              type: integer
                              description: Source port.
                            sourcePortRange:
                              type: string
                              description: Source port range.
                            forward:
                              type: string
                              description: Accept or Drop.
                            bidirectional:
                              type: boolean
                              description: Also matches return traffic. Set for Accept,
                                as on a stateful firewall; never for Drop.
                            description:
                              type: string
                              description: Entry description.
                            ruleId:
                              type: string
                              description: Firewall rule UUID.
                        description: Policy entries in rule order.
                    description: The MicroSegmentationPolicy built when generation
                      is Enabled.
                  groupTags:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: GroupTag name.
                        addressGroup:
                          type: string
                          description: Firewall group it is made from.
                    description: 'GroupTags this report builds: every lower-case group
                      an exported rule names that has no operator GroupTag.'
                  steering:
                    type: array
                    items:
                      type: object
                      properties:
                        rule:
                          type: string
                          description: Firewall rule tagged eda-watch.
                        state:
                          type: string
                          description: 'STEERED: both directions go through the firewall
                            when generation is Enabled. ARMED: the rule''s dynamic
                            group has no members yet; tag an IP on the firewall to
                            steer it. REFUSED: see reasons.'
                        source:
                          type: object
                          properties:
                            prefix:
                              type: string
                              description: The whole IRB or routed subnet, or a host
                                or range inside one (a watched IP is a /32).
                            subnet:
                              type: string
                              description: The IRB or routed subnet a host or range
                                lies in. Empty when Prefix is the whole subnet.
                            virtualNetwork:
                              type: string
                              description: Virtual network of the subnet.
                            gateway:
                              type: string
                              description: The IRB or routed interface that routes
                                it, irbinterface/<name> or routedinterface/<name>.
                          description: Source subnet or host.
                        destination:
                          type: object
                          properties:
                            prefix:
                              type: string
                              description: The whole IRB or routed subnet, or a host
                                or range inside one (a watched IP is a /32).
                            subnet:
                              type: string
                              description: The IRB or routed subnet a host or range
                                lies in. Empty when Prefix is the whole subnet.
                            virtualNetwork:
                              type: string
                              description: Virtual network of the subnet.
                            gateway:
                              type: string
                              description: The IRB or routed interface that routes
                                it, irbinterface/<name> or routedinterface/<name>.
                          description: Destination subnet or host.
                        router:
                          type: string
                          description: The router (VRF) both sides are on.
                        nextHop:
                          type: string
                          description: The firewall interface address on that router.
                        hopNode:
                          type: string
                          description: Leaf the firewall interface is attached to.
                        reasons:
                          type: array
                          items:
                            type: string
                          description: Why the pair is not steered, or why the rule
                            is armed.
                        warnings:
                          type: array
                          items:
                            type: string
                          description: 'Where the firewall would let steered traffic
                            through that the fabric policy does not carry: WATCH_ALLOW_NOT_IN_FABRIC
                            (an allow rule that is not exported), WATCH_FALLTHROUGH_ALLOW
                            (the first rule matching all of the pair allows it), WATCH_NO_DENY
                            (nothing denies the rest).'
                        ruleId:
                          type: string
                          description: Firewall rule UUID.
                    description: 'Policy-based routing through the firewall for rules
                      tagged eda-watch: one row per source and destination subnet
                      pair, both directions, whole subnets only, same router only.
                      Built as one Configlet per leaf when generation is Enabled.'
                  blockers:
                    type: array
                    items:
                      type: string
                    description: Fabric prerequisites that are missing. With any,
                      generation is Blocked.
                  hash:
                    type: string
                    description: Hash of this translation, computed by the collector.
                      Status Derived Hash takes the same value once EDA committed
                      it.
                  profile:
                    type: string
                    description: Compatibility profile used.
                description: 'The translation: the GroupTags and the MicroSegmentationPolicy.'
              vendor:
                type: string
                description: From the Firewall.
              managementMode:
                type: string
                description: The vendor API the collector reads, never a CLI. Follows
                  the vendor.
              managementScope:
                type: string
                description: The vsys (Palo Alto) or VDOM (FortiGate) read, from the
                  Firewall's Policy Scope. Default vsys1 or root.
              exportMarker:
                type: string
                description: 'How a rule opts in: rule-tag (Palo Alto) or section-label
                  (FortiGate).'
              exportTag:
                type: string
                description: The marker value. Rules without it are counted, not evaluated.
              compatibilityProfile:
                type: string
                description: 'The rulebook for what translates one-for-one into a
                  MicroSegmentationPolicy entry: IPv4, TCP or UDP ports, allow or
                  deny, one group to one group. Versioned, so a report shows which
                  rules it was judged by.'
              lastSuccessfulRevision:
                type: string
                description: Firewall config version of the last complete read.
              capturedAt:
                type: string
                description: When the collector read the firewall. A change to this
                  alone writes nothing.
              correlationId:
                type: string
                description: Hash of the evaluator version, firewall, revision, membership
                  and content. Changes when any of them do.
              generationRejectedAt:
                type: string
                description: When EDA last refused the policy.
              snapshot:
                type: object
                properties:
                  policyRevision:
                    type: string
                    description: Firewall config version read before the rules.
                  objectRevision:
                    type: string
                    description: Firewall config version read after the objects. It
                      differs from the Firewall Config Version when a commit landed
                      during the read, and the snapshot is then incomplete.
                  complete:
                    type: boolean
                    description: Every part of the read succeeded and both revisions
                      match.
                  rulesComplete:
                    type: boolean
                    description: The rulebase was read.
                  referencedObjectsComplete:
                    type: boolean
                    description: Every address, group and service the rules name was
                      read.
                  effectiveOrderComplete:
                    type: boolean
                    description: The rule order was read.
                  membershipReadComplete:
                    type: boolean
                    description: The runtime members of dynamic groups were read.
                  membershipObservationId:
                    type: string
                    description: Hash of the dynamic group members. It changes when
                      an IP is registered, even at the same config version.
                  sourceHash:
                    type: string
                    description: Hash of the raw API responses, computed by the collector.
                  normalisedHash:
                    type: string
                    description: Hash of the vendor-neutral model built from the read,
                      computed by the collector.
                  problems:
                    type: array
                    items:
                      type: string
                    description: Why the read is incomplete.
                description: What was read, with revisions and hashes.
            required:
            - firewall
          status:
            type: object
            properties:
              generation:
                type: string
                description: What EDA committed.
              policy:
                type: string
                description: The MicroSegmentationPolicy built.
              groupTags:
                type: integer
                description: Derived GroupTags built.
              entries:
                type: integer
                description: Policy entries built.
              translated:
                type: integer
                description: Rules translated.
              steered:
                type: integer
                description: Pairs EDA sends through the firewall.
              derivedHash:
                type: string
                description: The translation hash EDA committed. Equal to Derived
                  Hash in the spec when the fabric holds this translation.
              message:
                type: string
                description: Status message.
    subresources:
      status: {}
