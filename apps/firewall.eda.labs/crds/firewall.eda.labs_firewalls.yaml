---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: firewalls.firewall.eda.labs
spec:
  group: firewall.eda.labs
  names:
    kind: Firewall
    listKind: FirewallList
    plural: firewalls
    singular: firewall
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vendor
      name: Vendor
      type: string
    - jsonPath: .spec.endpointType
      name: Endpoint
      type: string
    - jsonPath: .status.operationalState
      name: State
      type: string
    - jsonPath: .status.health
      name: Health
      type: integer
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .spec.management.url
      name: Management
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FirewallSpec is an external firewall endpoint. It is not a TopoNode.
              The fabric attaches to it through FirewallInterface resources.
            properties:
              description:
                type: string
              endpointType:
                default: external-endpoint
                description: Always external-endpoint. Firewalls are not fabric nodes.
                enum:
                - external-endpoint
                type: string
              fabric:
                description: Fabric in this namespace. The list shows every fabric
                  in the namespace.
                type: string
              management:
                description: |-
                  ManagementSpec is how the collector reaches the firewall API.
                  The password lives in a Secret named by secretRef, keys username and password.
                properties:
                  insecureSkipVerify:
                    description: Lab firewalls present a private certificate.
                    type: boolean
                  secretRef:
                    type: string
                  url:
                    description: HTTPS URL of the firewall UI or API, including port.
                    type: string
                required:
                - url
                type: object
              peering:
                description: |-
                  How this firewall joins the fabric. Palo Alto uses eBGP to a virtual network.
                  FortiGate VDOM 1 can use VLAN eBGP to a leaf. VDOM 2 uses EVPN in Advanced Networking.
                properties:
                  tenants:
                    description: |-
                      Tenants on this firewall. Palo Alto: a virtual system. FortiGate: a VDOM.
                      This FortiGate license allows two VDOMs.
                    items:
                      description: TenantSpec is one Palo Alto virtual system or one
                        FortiGate VDOM.
                      properties:
                        localAS:
                          description: AS EDA uses on this session. The fabric overlay
                            is 65001.
                          format: int32
                          type: integer
                        mode:
                          description: |-
                            ebgp for a Palo Alto virtual system or a FortiGate edge VDOM.
                            ibgp for a FortiGate service VDOM on EVPN.
                          enum:
                          - ebgp
                          - ibgp
                          type: string
                        name:
                          type: string
                        peerAS:
                          description: AS of the firewall tenant. iBGP uses the same
                            AS as Local AS.
                          format: int32
                          type: integer
                        routeHandoff:
                          default: clients-use-firewall
                          description: |-
                            Who installs the path between the clients and the firewall.
                            clients-use-firewall keeps the firewall as the client gateway.
                            firewall-originates-default advertises 0.0.0.0/0 from the firewall.
                            fabric-static-to-firewall installs a static on the virtual network toward the firewall.
                          enum:
                          - clients-use-firewall
                          - firewall-originates-default
                          - fabric-static-to-firewall
                          type: string
                        virtualNetworks:
                          description: |-
                            Virtual networks that eBGP with this Palo Alto tenant.
                            A FortiGate edge VDOM leaves this empty and peers to the leaf.
                          items:
                            type: string
                          type: array
                      required:
                      - mode
                      - name
                      type: object
                    maxItems: 2
                    type: array
                  underlay:
                    description: evpn-vxlan is the FortiGate service underlay. Leave
                      empty for Palo Alto.
                    enum:
                    - evpn-vxlan
                    type: string
                type: object
              vendor:
                enum:
                - paloalto
                - fortinet
                type: string
            required:
            - management
            - vendor
            type: object
          status:
            description: FirewallStatus is health and the networking rollup for one
              external endpoint.
            properties:
              bgp:
                description: BGP sessions read from the firewall on the last poll.
                items:
                  description: BGPSessionStatus is one BGP session reported by the
                    firewall API.
                  properties:
                    mode:
                      type: string
                    neighbor:
                      type: string
                    state:
                      type: string
                  type: object
                type: array
              collection:
                description: |-
                  poll. These firewalls do not stream gNMI. Each poll writes this status,
                  and that write is the change EDA shows.
                type: string
              endpointType:
                type: string
              events:
                description: Recent vendor events from the last poll.
                items:
                  description: EventStatus is one vendor event from the last poll.
                  properties:
                    message:
                      type: string
                    severity:
                      type: string
                    time:
                      type: string
                  type: object
                type: array
              health:
                type: integer
              interfaceCount:
                type: integer
              lastChecked:
                type: string
              license:
                description: licensed, not-required, unknown, or the vendor license
                  state.
                type: string
              message:
                type: string
              model:
                type: string
              networking:
                items:
                  description: NetworkingStatus is one firewall NIC as seen from this
                    endpoint.
                  properties:
                    address:
                      type: string
                    attachment:
                      type: string
                    interface:
                      type: string
                    name:
                      type: string
                    node:
                      type: string
                    observedAddress:
                      type: string
                    operationalState:
                      type: string
                    side:
                      type: string
                    virtualNetwork:
                      type: string
                    zone:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              operationalState:
                description: Up, Down, Degraded, or Unknown.
                type: string
              reachable:
                type: boolean
              serial:
                type: string
              vendor:
                type: string
              version:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
