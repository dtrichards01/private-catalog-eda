---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: firewallpolicysources.firewall.eda.labs
spec:
  group: firewall.eda.labs
  names:
    kind: FirewallPolicySource
    listKind: FirewallPolicySourceList
    plural: firewallpolicysources
    singular: firewallpolicysource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.firewall
      name: Firewall
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.generation
      name: Generation
      type: string
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .spec.virtualNetwork
      name: Virtual Network
      type: string
    - jsonPath: .status.sourceHealth
      name: Health
      type: string
    - jsonPath: .status.policyRevision
      name: Revision
      type: string
    - jsonPath: .status.exported
      name: Exported
      type: integer
    - jsonPath: .status.ngfwRequired
      name: NGFW
      type: integer
    - jsonPath: .status.unsupported
      name: Unsupported
      type: integer
    - jsonPath: .status.derived.entries
      name: Derived
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FirewallPolicySourceSpec selects the committed security policy of one
              firewall scope: a Palo Alto vsys or a FortiGate VDOM. Only rules marked
              eda-export-to-gbp are evaluated: a rule tag on Palo Alto, the policy
              section label on FortiGate. Observe mode reads and reports. Derive mode
              also builds the Microsegmentation App GroupTags, AssociationPolicies and one
              MicroSegmentationPolicy from the rules the built-in profile translates one
              for one, when the Firewall has policy generation Enabled. They are derived,
              read-only resources of the policy report and follow the firewall on every
              commit. The firewall itself is never changed.
            properties:
              additionalVirtualNetworks:
                description: Further Virtual Networks members may belong to. The derived
                  policy targets all of them and its GroupTags are Global.
                items:
                  type: string
                type: array
              firewall:
                description: |-
                  Firewall in this namespace. Its vendor, management URL and credential Secret are reused.
                  The Palo Alto reader ships now. The FortiGate reader is not in this release, so a FortiGate source reports UNAVAILABLE.
                type: string
              groups:
                description: |-
                  Controlled taxonomy: each Palo Alto dynamic address group, the one tag its filter must be,
                  and the existing EDA GroupTag it stands for. Other groups and tags are ignored.
                items:
                  description: PolicyGroupBinding maps one controlled firewall address
                    group to an EDA GroupTag.
                  properties:
                    addressGroup:
                      description: Palo Alto dynamic address group, or FortiGate address
                        group.
                      pattern: ^[A-Za-z0-9._ -]{1,79}$
                      type: string
                    bridgeInterfaces:
                      description: Bridge interfaces whose traffic gets this tag.
                      items:
                        type: string
                      type: array
                    groupTag:
                      description: Observe mode requires it to exist. Derive mode
                        reuses an existing one or builds it.
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    tag:
                      description: 'Palo Alto: the one tag the dynamic group''s filter
                        must be. FortiGate: not used.'
                      pattern: ^[A-Za-z0-9._-]{1,127}$
                      type: string
                    vlans:
                      description: Inline VLANs of the Virtual Networks whose traffic
                        gets this tag. Every member must sit in one of their subnets.
                      items:
                        type: string
                      type: array
                  required:
                  - addressGroup
                  - groupTag
                  type: object
                type: array
              mode:
                default: observe
                description: observe reads, normalises and classifies. derive also
                  builds the Microsegmentation App objects when the Firewall's Policy
                  Generation is Enabled.
                enum:
                - observe
                - derive
                type: string
              scope:
                description: Palo Alto vsys or FortiGate VDOM that holds the rulebase.
                  Empty means vsys1 or root.
                pattern: ^[A-Za-z0-9_-]{1,31}$
                type: string
              serviceTarget:
                description: Router or bridge domain in the Virtual Network that fabric
                  policy would target. Never inferred.
                type: string
              virtualNetwork:
                description: The one Virtual Network every group member must belong
                  to. Members in another network are reported, not mapped.
                type: string
            required:
            - firewall
            - virtualNetwork
            type: object
          status:
            description: FirewallPolicySourceStatus is the summary of the latest FirewallPolicyReport.
            properties:
              compatibilityProfile:
                type: string
              complete:
                type: boolean
              correlationId:
                type: string
              derived:
                description: Present in derive mode.
                properties:
                  associations:
                    items:
                      type: string
                    type: array
                  entries:
                    type: integer
                  groupTags:
                    items:
                      type: string
                    type: array
                  hash:
                    description: Changes whenever the derived objects change.
                    type: string
                  policy:
                    type: string
                required:
                - entries
                type: object
              exportMarker:
                description: rule-tag (Palo Alto) or section-label (FortiGate).
                type: string
              exported:
                type: integer
              generation:
                description: |-
                  Derive mode only. Enabled builds the derived objects, Disabled means the Firewall's Policy Generation is off,
                  Rejected means EDA refused them (see reasons) and they are retried when the translation changes or after 15 minutes.
                type: string
              groups:
                items:
                  description: PolicyGroupStatus is one group binding after identity
                    and scope checks.
                  properties:
                    addressGroup:
                      type: string
                    groupTag:
                      type: string
                    reasons:
                      items:
                        type: string
                      type: array
                    state:
                      type: string
                  type: object
                type: array
              lastChanged:
                description: Time of the last change to the report.
                type: string
              membershipObservationId:
                description: Changes when dynamic group membership or registered IPs
                  change without a commit.
                type: string
              message:
                type: string
              mode:
                description: Mode the report was produced in.
                type: string
              ngfwRequired:
                type: integer
              policyRevision:
                description: Palo Alto config version of the snapshot.
                type: string
              reasons:
                description: Scope problems that make every rule unsupported.
                items:
                  type: string
                type: array
              ruleCount:
                type: integer
              rules:
                items:
                  description: PolicyRuleStatus is one exported rule after evaluation.
                  properties:
                    action:
                      type: string
                    candidate:
                      description: What a validated compatibility profile would allow,
                        when only the profile or identity blocks the rule.
                      type: string
                    classification:
                      description: FABRIC_ENFORCEABLE, FABRIC_ENFORCEABLE_DENY, NGFW_REQUIRED
                        or UNSUPPORTED.
                      type: string
                    derivedEntries:
                      description: MicroSegmentationPolicy entries built from this
                        rule.
                      type: integer
                    inspectionRequirement:
                      type: string
                    name:
                      type: string
                    position:
                      type: integer
                    reasons:
                      items:
                        type: string
                      type: array
                    translationState:
                      description: PROPOSED, VALIDATED when derive mode translated
                        it, or NOT_TRANSLATED.
                      type: string
                  type: object
                type: array
              scopeKind:
                description: vsys or vdom.
                type: string
              sourceHealth:
                description: OK, STALE_SOURCE when the read was incomplete or a commit
                  landed during it, or UNAVAILABLE.
                type: string
              unsupported:
                type: integer
              vendor:
                type: string
            required:
            - exported
            - ngfwRequired
            - ruleCount
            - unsupported
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
