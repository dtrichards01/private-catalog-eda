apiVersion: core.eda.nokia.com/v1
kind: Manifest
metadata:
  name: firewall
spec:
  group: firewall.eda.labs
  version: v1alpha1
  title: Firewalls
  description: Lab prototype for two firewall use cases. Not a product. Production EDA-to-firewall API is Push Pull Provider in EDA 26.12.1.
  image: ghcr.io/dtrichards01/private-eda-registry/firewall:v1.3.5
  author: dtrichards01
  gitPathPrefix: /
  supportedEndpoints:
    - srl:25.*
    - srl:26.*
  supportedCoreVersions:
    - v4.0.0-0
    - v5.0.0-0
    - v6.0.0-0
  appInfo:
    documentation: firewall/docs
    readme: firewall/docs/README.md
    categories:
      - services
    ociSpecVersion: v1.0.0
    appImageDigest: sha256:5373937ab7a7f502455e1cd267abc0975e045089180163198c02b0c3422598d1
  components:
    - crd:
        path: firewall/crds/firewall.eda.labs_firewalls.yaml
        schema: firewall/openapiv3/eda_oas_firewall.eda.labs_firewalls.json
        api:
          expose: readWrite
        ui:
          category: Firewalls
          name: Firewalls
        names:
          kind: Firewall
          listKind: FirewallList
          plural: firewalls
          singular: firewall
    - crd:
        path: firewall/crds/firewall.eda.labs_firewallinterfaces.yaml
        schema: firewall/openapiv3/eda_oas_firewall.eda.labs_firewallinterfaces.json
        api:
          expose: readWrite
        ui:
          category: Firewalls
          name: Firewall Interfaces
        names:
          kind: FirewallInterface
          listKind: FirewallInterfaceList
          plural: firewallinterfaces
          singular: firewallinterface
    - script:
        path: firewall/intents/firewall/config_intent.py
        type: config
        trigger:
          kind: Firewall
    - script:
        path: firewall/intents/firewall/state_intent.py
        type: state
        trigger:
          kind: Firewall
    - script:
        path: firewall/intents/firewallinterface/config_intent.py
        type: config
        trigger:
          kind: FirewallInterface
    - script:
        path: firewall/intents/firewallinterface/state_intent.py
        type: state
        trigger:
          kind: FirewallInterface
    - crd:
        path: firewall/crds/firewall.eda.labs_firewallreports.yaml
        schema: firewall/openapiv3/eda_oas_firewall.eda.labs_firewallreports.json
        api:
          expose: readWrite
        names:
          kind: FirewallReport
          listKind: FirewallReportList
          plural: firewallreports
          singular: firewallreport
    - crd:
        path: firewall/crds/firewall.eda.labs_firewallinventories.yaml
        schema: firewall/openapiv3/eda_oas_firewall.eda.labs_firewallinventories.json
        api:
          expose: readWrite
        names:
          kind: FirewallInventory
          listKind: FirewallInventoryList
          plural: firewallinventories
          singular: firewallinventory
    - script:
        path: firewall/intents/firewallreport/state_intent.py
        type: state
        trigger:
          kind: FirewallReport
  dependencies:
    - file:
        path: firewall/api
    - file:
        path: firewall/intents
    - file:
        path: firewall/__init__.py
