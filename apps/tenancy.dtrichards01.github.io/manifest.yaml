apiVersion: core.eda.nokia.com/v1
kind: Manifest
metadata:
  name: tenancy
spec:
  group: tenancy.dtrichards01.github.io
  version: v1alpha1
  title: Service Tenancy
  description: DEV BUILD. Onboards tenant namespaces onto a Platform namespace. Grants Platform Interfaces and VLANs, and assigns per-tenant EVI, VNI and tunnel index ranges. Needs the dev Services build v7.0.1-xns2. Not for production.
  image: ghcr.io/dtrichards01/private-eda-registry/tenancy:v0.2.0
  author: dtrichards01
  gitPathPrefix: /
  supportedEndpoints:
    - srl:25.*
    - srl:26.*
  supportedCoreVersions:
    - v4.0.0-0
    - v5.0.0-0
    - v6.0.0-0
  appInfo:
    documentation: tenancy/docs
    readme: tenancy/docs/README.md
    categories:
      - services
    ociSpecVersion: v1.0.0
    appImageDigest: sha256:eeb71bbab7b57268d5365e5641f4cac135964b4c61de6e669f3003e1c85258ae
  components:
    - crd:
        path: tenancy/crds/tenancy.dtrichards01.github.io_tenants.yaml
        schema: tenancy/openapiv3/eda_oas_tenancy.dtrichards01.github.io_tenants.json
        api:
          expose: readWrite
        ui:
          category: Service Tenancy
          name: Tenants
        names:
          kind: Tenant
          listKind: TenantList
          plural: tenants
          singular: tenant
    - crd:
        path: tenancy/crds/tenancy.dtrichards01.github.io_grantedinterfaces.yaml
        schema: tenancy/openapiv3/eda_oas_tenancy.dtrichards01.github.io_grantedinterfaces.json
        api:
          expose: read
        ui:
          category: Service Tenancy
          name: Granted Interfaces
        names:
          kind: GrantedInterface
          listKind: GrantedInterfaceList
          plural: grantedinterfaces
          singular: grantedinterface
    - script:
        path: tenancy/intents/tenant/config_intent.py
        type: config
        trigger:
          kind: Tenant
  dependencies:
    - file:
        path: tenancy/intents
    - file:
        path: tenancy/__init__.py
