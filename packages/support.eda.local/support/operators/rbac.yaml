apiVersion: v1
kind: ServiceAccount
metadata:
  name: eda-support-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eda-support-monitor
rules:
  - apiGroups: ["support.eda.local"]
    resources: ["alarmworkflowrules", "supportmonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["workflows.eda.nokia.com"]
    resources: ["workflowdefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eda-support-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eda-support-monitor
subjects:
  - kind: ServiceAccount
    name: eda-support-monitor
    namespace: eda
